name: Java CI/CD with Branch Strategy (Expandable Version)

on:
  push:
    branches:
      - 'dev'
      - 'feature/**'

env:
  DOCKER_IMAGE_NAME: my-app-dev
  # (a) 전역 설정 추가 위치:
  # 예: SERVER_PORT: 8080 같이 모든 단계에서 공통으로 쓸 변수를 여기에 선언합니다.

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # (b) 코드 정적 분석 추가 위치:
      # SonarQube나 Checkstyle 등을 사용하여 코드 품질을 검사하고 싶다면 여기서 실행합니다.

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # (c) 빌드 캐싱 추가 위치:
      # 빌드 속도를 높이기 위해 라이브러리(Gradle 캐시)를 저장하고 재사용하는 설정을 여기에 넣습니다.

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        # (d) 테스트 단계 추가 위치:
        # 실제 테스트 코드를 돌리고 싶다면 여기서 '-x test'를 지우고 실행하면 됩니다.
        run: ./gradlew build -x test

      # (e) 빌드 결과물(JAR) 보관 위치:
      # 도커 빌드 전 JAR 파일을 별도로 저장하거나 다른 곳으로 전송해야 할 때 사용합니다.

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker build & push
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/dev'

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            # (f) 무중단 배포(Blue-Green) 로직 추가 위치:
            # 새로운 컨테이너를 먼저 띄우고 포트를 교체하는 방식의 스크립트를 여기에 작성합니다.

            sudo docker stop ${{ env.DOCKER_IMAGE_NAME }} || true
            sudo docker rm ${{ env.DOCKER_IMAGE_NAME }} || true
            
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:latest
            
            # (g) 런타임 환경변수 주입 위치:
            # DB 비밀번호나 API 키를 컨테이너 실행 시 넣으려면 아래 run 명령에 -e 옵션을 추가합니다.
            # 예: -e SPRING_DATASOURCE_URL=${{ secrets.DB_URL }}
            
            sudo docker run -d \
              --name ${{ env.DOCKER_IMAGE_NAME }} \
              -p 8080:8080 \
              ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:latest
            
            sudo docker image prune -f

    # (h) 알림 서비스 추가 위치:
    # 전체 과정이 끝난 후 슬랙(Slack)이나 디스코드로 성공/실패 메시지를 보낼 때 사용합니다.
    # if: always() 옵션을 주면 성공하든 실패하든 알림이 갑니다.